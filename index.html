<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baby Dino Face Mask</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --jungle:#0F3D2E; --cream:#FBEFD9; --coral:#FF7A50; --sun:#F4C95D;
    --bg:#06110D; --panel:rgba(15,61,46,0.72); --text:#FBEFD9; --muted:#BFE3D4;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:'Nunito',system-ui,sans-serif; -webkit-user-select:none; user-select:none;}
  #stage{position:fixed; inset:0; height:100%; overflow:hidden;}
  video{position:fixed; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none;}
  canvas#view{position:absolute; inset:0; width:100%; height:100%; background:#04120C;}

  #status{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:32px; z-index:6;
    background:radial-gradient(circle at 50% 30%, #14523d, #06110D 75%);}
  #status p{max-width:280px; color:var(--muted); font-size:15px; line-height:1.5; margin:0;}
  #status .spinner{width:34px; height:34px; border-radius:50%; border:4px solid rgba(255,255,255,0.2);
    border-top-color:var(--sun); animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #retryBtn{font-family:'Baloo 2'; font-weight:600; background:var(--coral); color:#2B0F04;
    border:none; padding:12px 22px; border-radius:999px; font-size:16px; cursor:pointer;}

  header{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:center; z-index:5; pointer-events:none;}
  #title{font-family:'Baloo 2'; font-weight:800; font-size:18px; letter-spacing:0.2px;
    background:var(--panel); backdrop-filter:blur(6px); padding:8px 14px; border-radius:999px;}
  #count{font-family:'Baloo 2'; font-weight:800; font-size:15px; background:var(--panel);
    backdrop-filter:blur(6px); padding:8px 14px; border-radius:999px; color:var(--sun);}

  #hint{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
    transform:translateX(-50%); font-size:13px; color:var(--muted); background:var(--panel);
    padding:6px 12px; border-radius:999px; white-space:nowrap; z-index:5; opacity:0; transition:opacity .3s;}

  footer{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    display:flex; justify-content:center; z-index:5;}
  #shutter{width:76px; height:76px; border-radius:50%; background:var(--cream); border:5px solid var(--coral);
    box-shadow:0 4px 18px rgba(0,0,0,0.4); cursor:pointer;}
  #shutter:active{transform:scale(0.94);}
  #shutter:disabled{opacity:0.4;}

  #result{position:fixed; inset:0; background:#050D0A; display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; padding:22px; gap:16px;}
  #result img{max-width:92vw; max-height:64vh; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  #resultMsg{font-family:'Baloo 2'; font-weight:800; font-size:20px; color:var(--sun); text-align:center;}
  .row{display:flex; gap:12px;}
  .pill{font-family:'Baloo 2'; font-weight:600; font-size:15px; border:none; border-radius:999px;
    padding:12px 20px; cursor:pointer;}
  .pill.primary{background:var(--coral); color:#2B0F04;}
  .pill.secondary{background:var(--panel); color:var(--cream);}
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="view"></canvas>
  <div id="status">
    <div class="spinner" id="spinner"></div>
    <p id="statusMsg">Loading face tracking&hellip;</p>
    <button id="retryBtn" style="display:none;">Try again</button>
  </div>
  <div id="hint">Show your face to grow the mask 🦕</div>
</div>

<header>
  <div id="title">🦕 Baby Dino Face</div>
  <div id="count">Snapped: 0</div>
</header>

<footer><button id="shutter" disabled aria-label="Take photo"></button></footer>

<div id="result">
  <div id="resultMsg">Gotcha! 🎉</div>
  <img id="resultImg" alt="Your baby dino mask photo">
  <div class="row">
    <button class="pill secondary" id="retakeBtn">Retake</button>
    <button class="pill primary" id="shareBtn">Share</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script>
const video=document.getElementById('video'), view=document.getElementById('view'),
  ctx=view.getContext('2d'), statusEl=document.getElementById('status'),
  statusMsg=document.getElementById('statusMsg'), spinner=document.getElementById('spinner'),
  retryBtn=document.getElementById('retryBtn'), hint=document.getElementById('hint'),
  shutter=document.getElementById('shutter'), countEl=document.getElementById('count'),
  result=document.getElementById('result'), resultImg=document.getElementById('resultImg');
let caught=0, lastDet=null, busy=false, running=false;

function resize(){ view.width=window.innerWidth; view.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();

async function init(){
  statusMsg.textContent='Loading face tracking\u2026'; spinner.style.display='block'; retryBtn.style.display='none';
  statusEl.style.display='flex';
  try{
    const MODEL_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  }catch(e){
    spinner.style.display='none';
    statusMsg.textContent="Couldn't load the face-tracking model. Check your connection and try again.";
    retryBtn.style.display='inline-block';
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    video.srcObject=stream;
    await video.play();
    statusEl.style.display='none'; shutter.disabled=false; running=true;
    requestAnimationFrame(loop);
  }catch(err){
    spinner.style.display='none';
    statusMsg.textContent = err.name==='NotAllowedError'
      ? "Camera access was blocked. Allow it in your browser's site settings, then try again."
      : "Couldn't reach a camera on this device.";
    retryBtn.style.display='inline-block';
  }
}
retryBtn.addEventListener('click', init);
init();

function coverRect(vw,vh,cw,ch){
  const cr=cw/ch, vr=vw/vh; let sx,sy,sw,sh;
  if(vr>cr){ sh=vh; sw=vh*cr; sx=(vw-sw)/2; sy=0; } else { sw=vw; sh=vw/cr; sx=0; sy=(vh-sh)/2; }
  return {sx,sy,sw,sh};
}
function mapPt(p, r, cw, ch){ return { x:(p.x-r.sx)*(cw/r.sw), y:(p.y-r.sy)*(ch/r.sh) }; }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

const MASK_HOLE_L = {x:134.2, y:246.6}; // screen-left eye hole, as drawn in the artwork
const MASK_HOLE_R = {x:314.4, y:245.8}; // screen-right eye hole
const maskImg = new Image();
let maskReady = false;
maskImg.onload = ()=>{ maskReady = true; };
maskImg.src = MASK_SRC;

function drawMask(pts, cw, ch){
  if(!maskReady) return;
  const eyeR=mid(pts[36],pts[39]), eyeL=mid(pts[42],pts[45]); // screen-left / screen-right eyes
  const srcVec={x:MASK_HOLE_R.x-MASK_HOLE_L.x, y:MASK_HOLE_R.y-MASK_HOLE_L.y};
  const dstVec={x:eyeL.x-eyeR.x, y:eyeL.y-eyeR.y};
  const scale=Math.hypot(dstVec.x,dstVec.y)/Math.hypot(srcVec.x,srcVec.y);
  const angle=Math.atan2(dstVec.y,dstVec.x)-Math.atan2(srcVec.y,srcVec.x);

  ctx.save();
  ctx.translate(eyeR.x, eyeR.y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.drawImage(maskImg, -MASK_HOLE_L.x, -MASK_HOLE_L.y);
  ctx.restore();
}

async function loop(){
  if(!running) return;
  const cw=view.width, ch=view.height;
  if(video.videoWidth){
    const r=coverRect(video.videoWidth, video.videoHeight, cw, ch);
    ctx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, cw, ch);
    if(lastDet && lastDet.landmarks){
      const mapped=lastDet.landmarks.positions.map(p=>mapPt(p,r,cw,ch));
      drawMask(mapped, cw, ch);
      hint.style.opacity='0';
    } else {
      hint.style.opacity='1';
    }
  } else {
    ctx.fillStyle='#04120C'; ctx.fillRect(0,0,cw,ch);
  }
  if(!busy){
    busy=true;
    faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({inputSize:224, scoreThreshold:0.5}))
      .withFaceLandmarks(true)
      .then(d=>{ lastDet=d||null; busy=false; })
      .catch(()=>{ busy=false; });
  }
  requestAnimationFrame(loop);
}

shutter.addEventListener('click', ()=>{
  resultImg.src=view.toDataURL('image/png');
  caught++; countEl.textContent='Snapped: '+caught;
  result.style.display='flex';
});
document.getElementById('retakeBtn').addEventListener('click', ()=> result.style.display='none');
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const blob=await (await fetch(resultImg.src)).blob();
  const file=new File([blob],'baby-dino-mask.png',{type:'image/png'});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'I turned into a baby dino!'}); return; }catch(e){}
  }
  const a=document.createElement('a'); a.href=resultImg.src; a.download='baby-dino-mask.png';
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
